<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
 <defs>
 <!-- 仅保留 V 形的蓝青渐变 -->
 <linearGradient id="vGrad" x1="210" y1="210" x2="390" y2="420" gradientUnits="userSpaceOnUse">
 <stop offset="0" style="stop-color:#3B82F6;stop-opacity:1" />
 <stop offset="0.4" style="stop-color:#2563EB;stop-opacity:1" />
 <stop offset="0.7" style="stop-color:#2DD4BF;stop-opacity:1" />
 <stop offset="1" style="stop-color:#14B8A6;stop-opacity:1" />
 </linearGradient>
 </defs>

 <!-- 1. 经典硬朗盾牌：白色填充 + 加粗翠绿色描边 -->
 <path
 d="M 300 40
 L 510 110
 L 510 330
 C 510 450 300 560 300 560
 C 300 560 90 450 90 330
 L 90 110
 Z"
 fill="#FFFFFF"
 stroke="#10B981"
 stroke-width="32"
 stroke-linejoin="round" />

 <!-- 2. 内部 V 图标：保留原渐变，无任何滤镜 -->
 <path
 d="M 175 195 L 300 435 L 425 195"
 stroke="url(#vGrad)"
 stroke-width="75"
 stroke-linecap="round"
 stroke-linejoin="round"
 fill="none" />
</svg>
